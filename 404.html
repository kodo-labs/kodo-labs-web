<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Kodo Labs</title>
    <meta name="description" content="La página que buscás no existe. Volvé al inicio de Kodo Labs.">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/png" sizes="32x32" href="/images/faviconkodo.png">
    <link rel="apple-touch-icon" sizes="256x256" href="/images/faviconkodo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #00c851;
            --secondary-green: #1db954;
            --gradient-primary: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-primary);
            background: linear-gradient(135deg, #000000, #1a1a1a, #2d2d2d);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .wrap { max-width: 560px; }

        .logo { width: 72px; height: auto; margin-bottom: 2rem; }

        .code {
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.95rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 200, 81, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 200, 81, 0.4);
        }

        .btn-ghost {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
        }

        .btn-ghost:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
            .btn-primary:hover { transform: none; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <img src="/images/kodo-labs-logo.png" alt="Kodo Labs" class="logo">
        <div class="code">404</div>
        <h1>Esta página no existe</h1>
        <p>Puede que el enlace esté roto o que la página se haya movido. Volvé al inicio y seguimos desde ahí.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Ir al inicio</a>
            <a href="/#contacto" class="btn btn-ghost">Contactanos</a>
        </div>
    </main>
</body>
</html>
